[package]
name = "pizza-hybrid-bench"
version = "0.1.0"
edition = "2021"

[features]
default = []

[dependencies]
serde = "1.0"
serde_derive = "1.0"
serde_json = "1.0"
hashbrown = "0.14.5"
spin = { version = "0.9", default-features = false, features = ["rwlock"] }
monoio = { version = "0.2.4", features = ["iouring", "legacy", "macros", "utils", "signal"] }

# Internal libs
pizza-engine = { path = "/Users/medcl/rust/pizza/lib/engine", features = ["query_string_parser", "persistence", "std", "benchmark_internal"] }

[profile.release]
lto = true
opt-level = 3
overflow-checks = false
codegen-units = 1
