[package]
name = "pizza-bench"
version = "0.1.0"
edition = "2021"

[features]
default = []
profiling = []

[dependencies]
serde = "1.0"
serde_derive = "1.0"
serde_json = "1.0"
hashbrown = "0.14.5"

# Internal libs
pizza-engine = { path = "/Users/medcl/rust/pizza/lib/engine", features = ["query_string_parser", "persistence", "std", "benchmark_internal"] }

[profile.release]
lto = true
opt-level = 3
overflow-checks = false
codegen-units = 1
